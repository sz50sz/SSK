<body class="login">
    <div class="header">
        <div class="header__inner">
            <a href="./start.html" class="back-button">
                <span></span>
            </a>
        </div>
    </div>

    <header class="login__header">
        <div class="login__header__inner">
            <div class="login__header__logo"><img src="" alt=""></div>

    <main class="login__main">
        <div class="login__inner">
            <h1 class="login__title">sottoの番号を入力してください</h1>
            <form class="login__form">
                <div class="login__form__item">
                    <input type="email" id="email" name="email" class="login__form__input"
                        placeholder="konnichiwa.0000@gmail.com">
                </div>
                <a href="./business-password.html" type="submit" class="login__form__button" id="business__button">
                    次へ
                </a>
            </form>
        </div>
    </main>
