<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ホーム</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/the-new-css-reset/css/reset.min.css">
    <link rel="stylesheet" href="./css/style-amano.css">
</head>

<body>
    <header class="header">
        <div class="header__inner">
            <div class="header__logo"><img src="./images/logo2.webp" alt="sottoのロゴ" class="header__logo-pic"></div>
            <a class="header__news" href="./news.html" aria-label="お知らせ">
                <img class="header__news-pic" src="./images/news-icon.webp" alt="">
            </a>
        </div>
    </header>
    <main class="main">
        <div class="main__inner">
            <div class="main__banner">
                <p class="main__banner-text">広告バナー</p>
            </div>
            <section class="main__info">
                <div class="main__grid">
                    <div class="main__unit">
                        <p class="main__unit-text">
                            残り時間
                        </p>
                        <span class="main__unit-time" id="timer">5:00</span>
                    </div>
                    <div class="main__methods">
                        <button type="button" class="main__method">取り出す方法</button>
                        <button type="button" class="main__method">取り出す方法</button>
                    </div>
                </div>
                <p class="main__notice">
                    ※なんか文章を書こう。なんか文章を書こう。なんか文章を書こう。なんか文章を書こう。なんか文章を書こう。なんか文章を書こう。
                </p>
                <div class="main__takeout">
                    <button type="button" class="main__takeout-btn">sottoから取り出す</button>
                </div>
                <p class="main__notice">
                    ※なんか注意点をかこう。なんか注意点をかこう。
                </p>
            </section>
            <div class="main__banner">
                <p class="main__banner-text">広告バナー</p>
            </div>
        </div>
    </main>

    <div class="main__method-modal" id="method-modal" hidden>
        <div class="main__method-modal-content" role="dialog" aria-modal="true" aria-labelledby="method-modal-title">
            <button type="button" class="main__method-modal-close" aria-label="閉じる"></button>

            <h2 class="main__method-modal-title" id="method-modal-title">取り出す方法</h2>

            <div class="main__method-slides" aria-live="polite">
                <section class="main__method-slide is-active">
                    <div class="main__method-pic1 main__method-pic-frame">
                        <img src="./images/sotto_method1.webp" alt="sottoから生理用品を取り出す方法の説明1" class="main__method-pic">
                    </div>
                    <p>ホーム画面の「sottoから取り出す」をタップ</p>
                </section>
                <section class="main__method-slide">
                    <div class="main__method-pic2 main__method-pic-frame">
                        <img src="./images/sotto_method2.webp" alt="sottoから生理用品を取り出す方法の説明2" class="main__method-pic">
                    </div>
                    <p>画面に表示されたQRコードをディスペンサーのカメラにかざす</p>
                </section>
                <section class="main__method-slide">
                    <div class="main__method-pic3 main__method-pic-frame">
                        <img src="./images/sotto_method3.webp" alt="sottoから生理用品を取り出す方法の説明3" class="main__method-pic">
                    </div>
                    <p>ディスペンサーの受け取り口から出てきた生理用品を受け取る</p>
                </section>
            </div>

            <div class="main__method-modal-controls">

                <div class="main__method-dots" aria-label="ページ">
                    <span class="main__method-dot is-active"></span>
                    <span class="main__method-dot"></span>
                    <span class="main__method-dot"></span>
                </div>
                <div class="main__method-btns">
                    <button type="button" class="main__method-back">戻る</button>

                    <button type="button" class="main__method-next">次へ</button>
                </div>
            </div>
        </div>
    </div>

    <div class="qr-modal" id="qr-modal" hidden>
        <div class="qr-modal__content" role="dialog" aria-modal="true" aria-labelledby="qr-modal-h2">
            <button type="button" class="qr-modal__close" aria-label="閉じる"></button>
            <h2 class="qr-modal-h2" id="qr-modal-h2">QRコードを<br>スキャンしてください</h2>
            <div id="qr-code" aria-label="端末ごとのQRコード"></div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer__inner">
            <nav class="footer__nav">
                <ul class="footer__list">
                    <li class="footer__item">
                        <a href="./map.html" class="footer__item-link">

                            <img src="./images/map.webp" alt="マップのアイコン" class="footer__item-icon">
                            <span class="footer__name">マップ</span>
                        </a>
                    </li>

                    <li class="footer__item-home">
                        <a href="./index.html" class="footer__item-link">
                            <div class="footer__home-icon">
                                <img src="./images/home.webp" alt="ホームのアイコン">
                                <span class="footer__name">ホーム</span>
                            </div>
                        </a>
                    </li>

                    <li class="footer__item">
                        <a href="./mypage.html" class="footer__item-link">

                            <img src="./images/mypage.webp" alt="マイページのアイコン" class="footer__item-icon">
                            <span class="footer__name">マイページ</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </footer>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="./JS/qr-code.js"></script>
    <script src="./JS/index-amano.js"></script>
</body>

</html>
