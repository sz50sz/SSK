<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>sotto MAP</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
    <script src="./JS/index-yoshizawa.js" defer></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/the-new-css-reset/css/reset.min.css">
    <link rel="stylesheet" href="./sass/style-yoshizawa.css">
</head>


<body class="desktop business">

    <!-- サイドバー -->
    <header class="business__header">
        <h1 class="business__logo"></h1>

        <h2 class="business__name">山田</h2>

        <nav class="business__navi navi">
            <ul class="navi__list">

                <li class="navi__item">
                    <a href="./business-home.html">
                        <span class="navi__icon"></span>
                        ホーム
                    </a>
                </li>

                <li class="navi__item ">
                    <a href="./business-news.html">
                        <span class="navi__icon"></span>
                        お知らせ
                    </a>
                </li>

                <li class="navi__item navi__item--active">
                    <a href="./business-contact.html">
                        <span class="navi__icon"></span>
                        お問い合わせ
                    </a>
                </li>

                <li class="navi__item">
                    <a href="business-setting.html">
                        <span class="navi__icon"></span>
                        設定
                    </a>
                </li>

            </ul>
        </nav>
    </header>


    <main class="ct">
        <div class="ct__inner">
            <h2 class="ct__title">お問い合わせ</h2>

            <form class="ct__form">
                <!-- 企業名 -->
                <div class="ct__unit">
                    <label class="ct__unit-label" for="company-1">
                        企業名
                        <span class="ct__required">必須</span>
                    </label>

                    <input type="text" id="company-1" name="company" class="ct__unit-input" placeholder="企業名を入力"
                        required>
                </div>

                <!-- メールアドレス -->
                <div class="ct__unit">
                    <label class="ct__unit-label" for="email">
                        メールアドレス
                        <span class="ct__required">必須</span>
                    </label>

                    <input type="email" id="email" name="email" class="ct__unit-input" placeholder="メールアドレスを入力"
                        required>
                </div>

                <!-- お問い合わせ種別 -->
                <div class="ct__unit">
                    <label class="ct__unit-label" for="category">
                        お問い合わせ種別
                        <span class="ct__required">必須</span>
                    </label>

                    <input type="text" id="category" name="category" class="ct__unit-input" placeholder="お問い合わせ種別を入力"
                        required>
                </div>

                <!-- 件名 -->
                <div class="ct__unit">
                    <label class="ct__unit-label" for="subject">
                        件名
                        <span class="ct__required">必須</span>
                    </label>

                    <input type="text" id="subject" name="subject" class="ct__unit-input" placeholder="件名を入力" required>
                </div>

                <!-- 内容 -->
                <div class="ct__contents">
                    <label class="ct__unit-label" for="content">
                        内容
                        <span class="ct__required">必須</span>
                    </label>

                    <textarea id="content" name="content" class="ct__unit-contentbox" placeholder="内容を入力"
                        required></textarea>
                </div>

                <!-- 送信ボタン -->
                <button class="ct__btn" type="submit">
                    送信する
                    <i class="fa-solid fa-paper-plane" aria-hidden="true"></i>
                </button>
            </form>
        </div>
    </main>
</body>
