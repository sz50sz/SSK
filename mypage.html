<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイページ</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/the-new-css-reset/css/reset.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="./css/style-amano.css">
</head>

<body class="mp">
    <header class="mh">
        <div class="mh__inner">
            <p class="mh__return">＜</p>
            <h1 class="mh__title">マイページ</h1>
        </div>
    </header>

    <main class="mm">
        <div class="mm__inner">
            <section class="mm__unit">
                <ul class="mm__list">
                    <li class="mm__item">
                        <a href="#" class="mm__link">
                            <div class="mm__item-unit">
                                <i class="fa-solid fa-gear mm__icon" style="color: rgb(15, 50, 86);"></i>
                                <p class="mm__name">登録情報</p>
                            </div>
                            <p class="mm__next">＞</p>
                        </a>
                    </li>
                    <li class="mm__item">
                        <a href="#" class="mm__link">
                            <div class="mm__item-unit">
                                <i class="fa-solid fa-bell mm__icon" style="color: rgb(15, 50, 86);"></i>
                                <p class="mm__name">通知設定</p>
                            </div>
                            <p class="mm__next">＞</p>
                        </a>
                    </li>
                    <li class="mm__item">
                        <a href="#" class="mm__link">
                            <div class="mm__item-unit">
                                <i class="fa-solid fa-circle-question mm__icon" style="color: rgb(15, 50, 86);"></i>

                                <p class="mm__name">ヘルプ</p>
                            </div>
                            <p class="mm__next">＞</p>
                        </a>
                    </li>
                    <li class="mm__item">
                        <a href="#" class="mm__link">
                            <div class="mm__item-unit">
                                <i class="fa-solid fa-comment mm__icon" style="color: rgb(15, 50, 86);"></i>
                                <p class="mm__name">お問い合わせ</p>
                            </div>
                            <p class="mm__next">＞</p>
                        </a>
                    </li>
                </ul>
            </section>
        </div>
    </main>

    <footer class="footer">
        <div class="footer__inner">
            <nav class="footer__nav">
                <ul class="footer__list">
                    <li class="footer__item">
                        <a href="#" class="footer__item-link">
                            <img src="./images/kanitama.jpg" alt="" class="footer__item-icon">
                            <span class="footer__name">マップ</span>
                        </a>
                    </li>

                    <li class="footer__item-home">
                        <a href="#" class="footer__item-link">
                            <div class="footer__home-icon">
                                <img src="./images/kanitama.jpg" alt="">
                                <span class="footer__name">ホーム</span>
                            </div>
                        </a>
                    </li>

                    <li class="footer__item">
                        <a href="#" class="footer__item-link">
                            <img src="./images/kanitama.jpg" alt="" class="footer__item-icon">
                            <span class="footer__name">マイページ</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </footer>
</body>

</html>
