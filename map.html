<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sotto MAP</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
    <script src="./JS/index-yoshizawa.js" defer></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/the-new-css-reset/css/reset.min.css">
    <link rel="stylesheet" href="./sass/style-yoshizawa.css">
</head>

<body class="map__page">

    <main class="map">

        <a href="./index.html" class="map__back" id="map-back" type="button" aria-label="マップに戻る">
            ＜
        </a>

        <div id="map" class="map__canvas"></div>

        <div class="map__search">
            <input class="map__search-input" type="search" placeholder="場所や施設名を検索">
        </div>

        <section class="map__detail" id="location-detail" hidden>

            <button class="map__detail-close" id="location-detail-close" type="button" aria-label="詳細を閉じる">
                ×
            </button>

            <h2 class="map__detail-title" id="location-detail-name"></h2>

            <dl class="map__detail-info">

                <div class="map__detail-item">
                    <dt>⭐️</dt>
                    <dd id="location-detail-hours"></dd>
                </div>

                <div class="map__detail-item">
                    <dt>⭐️</dt>
                    <dd id="location-detail-address"></dd>
                </div>

                <div class="map__detail-item">
                    <dt>⭐️</dt>
                    <dd id="location-detail-stock"></dd>
                </div>

            </dl>

            <button class="map__button" id="location-detail-map-button" type="button">
                マップアプリで表示
            </button>

        </section>

    </main>
    <footer class="footer">
        <div class="footer__inner">
            <nav class="footer__nav">
                <ul class="footer__list">
                    <li class="footer__item">
                        <a href="./map.html" class="footer__item-link">
                            <img src="./images/kanitama.jpg" alt="" class="footer__item-icon">
                            <span class="footer__name">マップ</span>
                        </a>
                    </li>

                    <li class="footer__item-home">
                        <a href="./index.html" class="footer__item-link">
                            <div class="footer__home-icon">
                                <img src="./images/kanitama.jpg" alt="">
                                <span class="footer__name">ホーム</span>
                            </div>
                        </a>
                    </li>

                    <li class="footer__item">
                        <a href="./mypage.html" class="footer__item-link">
                            <img src="./images/kanitama.jpg" alt="" class="footer__item-icon">
                            <span class="footer__name">マイページ</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </footer>

</body>

</html>
